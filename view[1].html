<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>View Paper</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#183047}
main{max-width:900px;margin:24px auto;padding:18px;background:white;border-radius:14px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
a{color:#1266d5}#paper{width:100%;max-height:82vh;object-fit:contain;margin-top:16px}
iframe{width:100%;height:82vh;border:0;margin-top:16px}
.note{color:#60758a;font-size:13px}
</style></head><body><main><header><h2 id="title">Paper</h2><a id="open" target="_blank" rel="noopener">Open original file</a></header>
<p class="note">Shared document. Only open or share documents you are authorized to access.</p><div id="content"></div></main>
<script>
const p=new URLSearchParams(location.search),file=p.get('file'),name=p.get('name')||'Paper';
document.getElementById('title').textContent=name;
if(!file){document.getElementById('content').textContent='No paper link was provided.'}
else{
 const u=document.getElementById('open');u.href=file;
 if(/\.pdf($|\?)/i.test(file)){const f=document.createElement('iframe');f.src=file;document.getElementById('content').appendChild(f)}
 else{const i=document.createElement('img');i.id='paper';i.src=file;i.alt=name;document.getElementById('content').appendChild(i)}
}
</script></body></html>
